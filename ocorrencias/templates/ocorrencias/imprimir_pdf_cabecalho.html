<!DOCTYPE html>
<html>
<head>
<style>
body { font-family: Arial; margin: 40px; }
header { text-align: center; margin-bottom: 20px; }
table { width: 100%; border-collapse: collapse; }
td, th { border: 1px solid #000; padding: 6px; }
</style>
</head>
<body>

<header>
<h2>RELATÓRIO OFICIAL DE OCORRÊNCIAS</h2>
<p>Escola: {{ escola_nome }}</p>
<p>Gerado em: {{ hoje }}</p>
</header>

<table>
<tr>
<th>Código</th><th>Aluno</th><th>Turma</th><th>Status</th><th>Data</th>
</tr>

{% for o in ocorrencias %}
<tr>
<td>{{ o.codigo }}</td>
<td>{{ o.aluno.nome }}</td>
<td>{{ o.turma }}</td>
<td>{{ o.get_status_display }}</td>
<td>{{ o.data }}</td>
</tr>
{% endfor %}
</table>

</body>
</html>
