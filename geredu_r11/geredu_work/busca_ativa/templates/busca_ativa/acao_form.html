{% extends "core/base.html" %}
{% block content %}
<div class="container" style="max-width:850px"><h2>Registrar providência</h2><p class="text-muted">{{ aluno.nome }} · {{ aluno.matricula }}</p><form method="post" class="card p-4">{% csrf_token %}
<div class="row g-3"><div class="col-md-4"><label class="form-label">Data</label><input class="form-control" type="date" name="data" value="{{ hoje }}" required></div><div class="col-md-8"><label class="form-label">Tipo de ação</label><select class="form-select" name="tipo" required><option value="">Selecione</option>{% for v,l in tipos %}<option value="{{ v }}">{{ l }}</option>{% endfor %}</select></div>
<div class="col-12"><label class="form-label">Descrição da providência *</label><textarea class="form-control" name="descricao" rows="3" required></textarea></div><div class="col-12"><label class="form-label">Resultado / retorno</label><textarea class="form-control" name="resultado" rows="2"></textarea></div><div class="col-md-8"><label class="form-label">Próxima ação</label><input class="form-control" name="proxima_acao"></div><div class="col-md-4"><label class="form-label">Prazo para retorno {% if exige_prazo %}*{% endif %}</label><input class="form-control" type="date" name="prazo" {% if exige_prazo %}required{% endif %}></div></div>
<div class="mt-3"><button class="btn btn-primary">Salvar providência</button> <a class="btn btn-outline-secondary" href="{% url 'busca_ativa:ficha' aluno.id %}">Cancelar</a></div><p class="text-muted mt-3 mb-0">O responsável será identificado automaticamente pelo usuário autenticado.</p></form></div>
{% endblock %}
