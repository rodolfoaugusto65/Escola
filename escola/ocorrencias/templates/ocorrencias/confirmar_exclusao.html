{% extends base_template %}
{% block content %}

<div class="container mt-5">
    <div class="card shadow border-0">
        <div class="card-body text-center">

            <h4 class="text-danger mb-3">
                Tem certeza que deseja excluir a ocorrência {{ ocorrencia.codigo }}?
            </h4>

            <form method="post">
                {% csrf_token %}
                <button type="submit" class="btn btn-danger">
                    🗑 Confirmar Exclusão
                </button>
                <a href="{% url 'lista_ocorrencias' %}" class="btn btn-secondary">
                    Cancelar
                </a>
            </form>

        </div>
    </div>
</div>

{% endblock %}
