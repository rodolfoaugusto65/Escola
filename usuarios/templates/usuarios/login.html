{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login - GerEdu</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<style>
body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #0f172a, #1e293b);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: "Inter", sans-serif;
}

.login-container {
    width: 100%;
    max-width: 420px;
}

.login-card {
    background: rgba(255,255,255,0.98);
    border-radius: 18px;
    padding: 40px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.2);
    animation: fadeUp 0.6s ease;
}

@keyframes fadeUp {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
}

.logo {
    text-align: center;
    margin-bottom: 30px;
}

.logo i {
    color: #38bdf8;
    width: 42px;
    height: 42px;
}

.logo h2 {
    margin-top: 10px;
    font-weight: 600;
    color: #0f172a;
}

.form-control {
    border-radius: 12px;
    padding: 12px;
}

.btn-login {
    background: linear-gradient(135deg, #38bdf8, #0ea5e9);
    border: none;
    border-radius: 12px;
    padding: 12px;
    font-weight: 600;
    transition: 0.3s ease;
}

.btn-login:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 20px rgba(14,165,233,0.3);
}

.forgot-password {
    text-align: center;
    margin-top: 15px;
}

.forgot-password a {
    color: #64748b;
    font-size: 0.9rem;
    text-decoration: none;
}

.forgot-password a:hover {
    color: #0ea5e9;
}

.footer-login {
    text-align: center;
    margin-top: 20px;
    font-size: 0.8rem;
    color: #94a3b8;
}

/* Toast SaaS */
.saas-toast {
    border-radius: 14px !important;
    padding: 14px 18px !important;
    font-size: 0.95rem !important;
    backdrop-filter: blur(8px);
    background: rgba(255,255,255,0.97) !important;
    box-shadow: 0 10px 30px rgba(0,0,0,0.08) !important;
    border-left: 6px solid #38bdf8;
}
</style>
</head>
<body>

<div class="login-container">
    <div class="login-card">

        <div class="logo">
            <i data-lucide="graduation-cap"></i>
            <h2>GerEdu</h2>
            <p class="text-muted small">Sistema de Gestão Escolar</p>
        </div>

        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">CPF</label>
                <input type="text" name="username" class="form-control cpf-mask" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Senha</label>
                <input type="password" name="password" class="form-control" required>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-login text-white">
                    Entrar
                </button>
            </div>
        </form>

        <div class="forgot-password">
            <a href="#" id="forgotLink">Esqueceu a senha?</a>
        </div>

        <div class="footer-login">
            © GerEdu - Desenvolvido por Welton
        </div>

    </div>
</div>

{% if messages %}
<script>
document.addEventListener("DOMContentLoaded", function() {

    const Toast = Swal.mixin({
        toast: true,
        position: 'top-end',
        showConfirmButton: false,
        timer: 4000,
        timerProgressBar: true,
        customClass: { popup: 'saas-toast' }
    });

    {% for message in messages %}
    Toast.fire({
        icon: '{% if message.tags == "success" %}success{% elif message.tags == "error" %}error{% elif message.tags == "warning" %}warning{% else %}info{% endif %}',
        title: "{{ message|escapejs }}"
    });
    {% endfor %}

});
</script>
{% endif %}

<script>
lucide.createIcons();

document.getElementById("forgotLink").addEventListener("click", function(e){
    e.preventDefault();

    Swal.fire({
        icon: 'info',
        title: 'Recuperação de Senha',
        text: 'Por favor, procure um administrador do sistema para redefinir sua senha.',
        confirmButtonColor: '#0ea5e9'
    });
});
</script>
<script>
document.addEventListener("DOMContentLoaded", function(){

    const form = document.querySelector("form");
    const cpfInput = document.querySelector("input[name='username']");

    form.addEventListener("submit", function(){
        if (cpfInput.value) {
            // Remove tudo que não for número
            cpfInput.value = cpfInput.value.replace(/\D/g, '');
        }
    });

});
</script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery.mask/1.14.16/jquery.mask.min.js"></script>

<script>
$(document).ready(function(){
    $('.cpf-mask').mask('000.000.000-00');
});
</script>
</body>
</html>
