{% extends "core/base.html" %}
{% block content %}

<div class="container mt-5 fade-in">
  <div class="card shadow-sm border-0 text-center p-5">

    <div class="mb-3">
        <i data-lucide="check-circle"
           style="width:70px;height:70px;color:#198754;"></i>
    </div>

    <h4 class="fw-bold">Senha alterada com sucesso!</h4>

    <p class="text-muted mt-2">
        Sua nova senha já está ativa.
    </p>

    <div class="mt-4">
        <a href="{% url 'perfil' %}" class="btn btn-primary btn-modern">
            Voltar ao Perfil
        </a>
    </div>

  </div>
</div>

<script>
document.addEventListener("DOMContentLoaded", function() {
    lucide.createIcons();
});
</script>

<style>
.btn-modern {
    border-radius: 10px;
    padding: 10px 18px;
    font-weight: 500;
    transition: all 0.2s ease;
}
.btn-modern:hover {
    transform: translateY(-2px);
    box-shadow: 0 10px 25px rgba(0,0,0,0.08);
}
</style>

{% endblock %}
