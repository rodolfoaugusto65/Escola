{% extends "core/base.html" %}
{% block title %}Nova Senha{% endblock %}

{% block content %}
<div class="container mt-5" style="max-width: 400px;">
    <h4 class="text-center mb-3">Defina sua nova senha</h4>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success w-100 mt-2">Salvar nova senha</button>
    </form>
</div>
{% endblock %}
