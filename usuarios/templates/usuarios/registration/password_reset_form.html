{% extends "core/base.html" %}
{% block title %}Redefinir Senha{% endblock %}

{% block content %}
<div class="container mt-5" style="max-width: 400px;">
    <h4 class="text-center mb-3">Redefinir Senha</h4>
    <p class="text-muted text-center">Informe seu e-mail cadastrado. Um link para redefinir a senha será enviado.</p>
    <form method="post">
        {% csrf_token %}
        {{ form.email.label_tag }}
        {{ form.email }}
        <button type="submit" class="btn btn-primary w-100 mt-3">Enviar link</button>
    </form>
</div>
{% endblock %}
