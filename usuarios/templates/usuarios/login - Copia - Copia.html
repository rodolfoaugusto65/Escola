{% load static %}

<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login | Sistema Escolar</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'core/css/style.css' %}">
</head>

<body>
{% if messages %}
<div class="toast-container position-fixed top-0 end-0 p-3" style="z-index: 9999;">
    {% for message in messages %}
    <div class="toast align-items-center text-bg-danger border-0 show" role="alert">
        <div class="d-flex">
            <div class="toast-body">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                {{ message }}
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto"
                    data-bs-dismiss="toast"></button>
        </div>
    </div>
    {% endfor %}
</div>
{% endif %}

<div class="login-wrapper">

    <div class="login-card">
        <h4>📘 Sistema Escolar</h4>

        {% if form.errors %}
            <div class="alert alert-danger text-center py-2">
                CPF ou senha inválidos.
            </div>
        {% endif %}

        <form method="post" novalidate id="loginForm">
            {% csrf_token %}

            <!-- CPF -->
            <div class="form-floating mb-3">
                <input
                    type="text"
                    name="username"
                    id="cpf"
                    class="form-control"
                    placeholder=" "
                    maxlength="14"
                    required
                >
                <label for="cpf">CPF</label>
            </div>

            <!-- SENHA -->
            <div class="form-floating mb-3 position-relative">
                <input
                    type="password"
                    name="password"
                    id="senha"
                    class="form-control"
                    placeholder=" "
                    required
                >
                <label for="senha">Senha</label>

                <!-- Mostrar senha -->
                <i
                    class="bi bi-eye-fill position-absolute"
                    id="toggleSenha"
                    style="top: 50%; right: 16px; transform: translateY(-50%); cursor: pointer;"
                ></i>
            </div>

            <button type="submit" class="btn btn-primary">
                <i class="bi bi-box-arrow-in-right"></i> Entrar
            </button>
        </form>

        <div class="login-links">
            <a href="{% url 'password_reset' %}">
                <i class="bi bi-question-circle"></i> Esqueceu a senha?
            </a>
        </div>
    </div>

</div>

<!-- JS -->
<script>
/* ===== CPF MÁSCARA (SOMENTE VISUAL) ===== */
const cpfInput = document.getElementById('cpf');

cpfInput.addEventListener('input', () => {
    let value = cpfInput.value.replace(/\D/g, '').slice(0, 11);

    if (value.length > 9) {
        value = value.replace(/(\d{3})(\d{3})(\d{3})(\d{0,2})/, '$1.$2.$3-$4');
    } else if (value.length > 6) {
        value = value.replace(/(\d{3})(\d{3})(\d{0,3})/, '$1.$2.$3');
    } else if (value.length > 3) {
        value = value.replace(/(\d{3})(\d{0,3})/, '$1.$2');
    }

    cpfInput.value = value;
});

/* ===== REMOVE MÁSCARA AO ENVIAR ===== */
document.getElementById('loginForm').addEventListener('submit', () => {
    cpfInput.value = cpfInput.value.replace(/\D/g, '');
});

/* ===== MOSTRAR / OCULTAR SENHA ===== */
const toggleSenha = document.getElementById('toggleSenha');
const senhaInput = document.getElementById('senha');

toggleSenha.addEventListener('click', () => {
    const type = senhaInput.type === 'password' ? 'text' : 'password';
    senhaInput.type = type;
    toggleSenha.classList.toggle('bi-eye-slash-fill');
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
function closeLoginError() {
    document.querySelector('.login-error-overlay').style.display = 'none';
}
</script>

<script>
document.querySelectorAll('.toast-close').forEach(btn => {
    btn.addEventListener('click', () => {
        btn.parentElement.remove();
    });
});

// Auto fechar em 5 segundos
setTimeout(() => {
    document.querySelectorAll('.toast-login').forEach(toast => {
        toast.remove();
    });
}, 5000);
</script>

</body>
</html>
